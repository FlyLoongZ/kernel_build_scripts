name: Build Android GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Choose Kernel source'
        required: true
        type: choice
        options:
          - gki_kernel@ztc1997
          - lineageos_xiaomi_sm8450
          - fork_melt

      BUILD_NUMBER:
        description: 'ci.android.com build number'
        required: true
        type: string

      ksu_patch:
        description: 'Add KernelSU patch'
        required: false
        type: choice
        options:
          - none
          - official_release
          - official_dev
          - mksu

      susfs4ksu_patch:
        description: 'Add susfs4ksu patch'
        required: false
        type: boolean

      ap_patch:
        description: 'Add Apatch release patch'
        required: false
        type: boolean

      ccache_set:
        description: 'Enable Ccache'
        required: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v4

      - name: Setup Ccache
        if: ${{ inputs.ccache_set }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G          
        
      - name: Set build date
        id: set-env-date
        run: echo "BUILDDATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      
      - name: Clone build tool
        run: |
          if [[ ${{ inputs.kernel_source }} == fork_melt ]]; then
            mkdir android_build_kernel
            cd android_build_kernel
          else
            mkdir -p ~/.bin
            PATH="${HOME}/.bin:${PATH}"
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
            chmod a+rx ~/.bin/repo

            mkdir android_build_kernel
            cd android_build_kernel
            git config --global user.email build-user@build-host
            git config --global user.name build-user
            ~/.bin/repo init -q -u https://github.com/FlyLoongZ/kernel_build_scripts -b repo_manifest
            ~/.bin/repo sync
          fi

          echo "=== Clone android llvm ==="
          mkdir -p prebuilts-master/clang/host/linux-x86
          cd prebuilts-master/clang/host/linux-x86
          if [[ ${{ inputs.kernel_source }} == lineageos_xiaomi_sm8450 ]]; then
            echo "- Choose clang-r416183b1"
            git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1 clang-r416183b
          else
            echo "- Choose clang-r547379"
            git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 clang-r416183b
          fi

      - name: Clone Kernel source
        run: |
          cd android_build_kernel
          if [[ ${{ inputs.kernel_source }} == gki_kernel@ztc1997 ]]; then
            echo "=== Choose gki_kernel@ztc1997 source ==="
            git clone --depth=1 https://github.com/ztc1997/android_gki_kernel_5.10_common.git common
            mv ../0001-ztc1997-build-fix.patch common/
            cd common
            git am 0001-ztc1997-build-fix.patch
          elif [[ ${{ inputs.kernel_source }} == lineageos_xiaomi_sm8450 ]]; then
            echo "=== Choose lineageos_xiaomi_sm8450 source ==="
            git clone --depth=1 https://github.com/cupid-development/android_kernel_xiaomi_sm8450.git common
            mv ../0001-lineageos_xiaomi_sm8450-build-fix.patch common/
            cd common
            git am 0001-lineageos_xiaomi_sm8450-build-fix.patch
          elif [[ ${{ inputs.kernel_source }} == fork_melt ]]; then
            echo "=== Choose fork_melt source ==="
            git clone --depth=1 https://github.com/FlyLoongZ/android_kernel_xiaomi_marble.git common
          else
            exit 1
          fi

      - name: Add the official KernelSU release
        if: contains(inputs.ksu_patch, 'official_release')
        run: | 
          cd android_build_kernel/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          cd KernelSU
          echo "KernelSU_version=$(expr 10200 + $(git rev-list --count HEAD))"  >> "$GITHUB_ENV"

      - name: Add the official KerenlSU dev
        if: contains(inputs.ksu_patch, 'official_dev')
        run: |
          cd android_build_kernel/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Add the 5ec1cff KernelSU
        if: contains(inputs.ksu_patch, 'mksu')
        run: |
          cd android_build_kernel/common
          curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Add susfs4ksu patch
        if: ${{ inputs.susfs4ksu_patch }}
        env:
          ksu_patch_set: ${{ inputs.ksu_patch }}
        run: |
          if [[ ${{ env.ksu_patch_set }} == none ]]; then
            echo "!!! KernelSU patch no enable !!!"
          elif  [[ ${{ env.ksu_patch_set }} == mksu ]]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10
            cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch android_build_kernel/common/KernelSU/
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch android_build_kernel/common/
            cp susfs4ksu/kernel_patches/fs/* android_build_kernel/common/fs/
            cp susfs4ksu/kernel_patches/include/linux/* android_build_kernel/common/include/linux/

            git clone https://github.com/WildPlusKernel/kernel_patches.git
            cp kernel_patches/mksu/fix.patch android_build_kernel/common/KernelSU/
            cp kernel_patches/mksu/mksu_susfs.patch android_build_kernel/common/KernelSU/
            cd android_build_kernel/common/KernelSU
            patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
            patch -p1 --forward < fix.patch
            patch -p1 --forward < mksu_susfs.patch

            cd ..
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
          else
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10
            cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch android_build_kernel/common/KernelSU/
            cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch android_build_kernel/common/
            cp susfs4ksu/kernel_patches/fs/* android_build_kernel/common/fs/
            cp susfs4ksu/kernel_patches/include/linux/* android_build_kernel/common/include/linux/

            cd android_build_kernel/common/KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch
            cd ..
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
          fi

      - name: Set Ccache env
        if: ${{ inputs.ccache_set }}
        run: |
          cd android_build_kernel
          mkdir .bin
          cd .bin
          ln -s /usr/bin/ccache clang
          
      - name: Build Kernel
        env: 
          ccache_set: ${{ inputs.ccache_set }}
          choice_kernel: ${{ inputs.kernel_source }}
        run: |
          if [[ ${{ env.ccache_set }} == true ]]; then
            export "CCACHE_LOCAL_PATH=.bin"
          else
            echo "=== No add Ccache ==="
          fi

          cd android_build_kernel/common
          git config --global user.email build-user@build-host
          git config --global user.name build-user
          cd ..

          if [[ ${{ inputs.kernel_source }} == fork_melt ]]; then
            cd common
            if [[ ${{ env.ccache_set }} == true ]]; then
              export PATH=$(realpath ../.bin):$(realpath ../prebuilts-master/clang/host/linux-x86/clang-r416183b/bin):$PATH
              clang -v
            else
              export PATH=$(realpath ../prebuilts-master/clang/host/linux-x86/clang-r416183b/bin):$PATH
              clang -v
            fi
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 BRANCH=android12-5.10 KMI_GENERATION=9 BUILD_NUMBER=${{ inputs.BUILD_NUMBER }} O=../out/android12-5.10/common mrproper
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 BRANCH=android12-5.10 KMI_GENERATION=9 BUILD_NUMBER=${{ inputs.BUILD_NUMBER }} O=../out/android12-5.10/common marble_defconfig
            make ARCH=arm64 LLVM=1 LLVM_IAS=1 BRANCH=android12-5.10 KMI_GENERATION=9 BUILD_NUMBER=${{ inputs.BUILD_NUMBER }} O=../out/android12-5.10/common -j$(nproc --all)
          else
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 BUILD_NUMBER=${{ inputs.BUILD_NUMBER }} build/build.sh -j4
          fi

      - name: Add Apatch
        if: ${{ inputs.ap_patch }}
        env:
          ap_key: ${{ secrets.Apatch_Key }}
        run: |
          cd android_build_kernel/out/android12-5.10/common/arch/arm64/boot
          mkdir apatch
          cd apatch
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android
          mv ../Image ../Image-old
          chmod +x kptools-linux
          ./kptools-linux -p --image ../Image-old --skey "$ap_key" --kpimg kpimg-android --out ../Image
          
      - name: Read Kernel version
        id: set-env-kernel-version
        run: echo "KERNEL_VERSION=$(awk -F'"' '{print $2}' android_build_kernel/out/android12-5.10/common/include/generated/utsrelease.h)" >> $GITHUB_OUTPUT

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: "Image-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}"
          path: android_build_kernel/out/android12-5.10/common/arch/arm64/boot/Image
      
      - name: Package the kerenl
        run: |
          if [[ ${{ inputs.kernel_source }} == fork_melt ]]; then
            export PATH=$(realpath android_build_kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin):$PATH
            git clone --depth=1 https://github.com/FlyLoongZ/AnyKernel3 -b Marble-Melt
            cp android_build_kernel/out/android12-5.10/common/arch/arm64/boot/Image AnyKernel3/Image
            cd AnyKernel3

            mkdir tmp_down
            cd tmp_down
            wget -q https://github.com/Pzqqt/android_kernel_xiaomi_marble/releases/latest/download/$(git ls-remote --sort=-version:refname --tags https://github.com/Pzqqt/android_kernel_xiaomi_marble Melt-marble-v\* | head -n 1 | awk -F'/' '{print $NF}')-multi.zip
            unzip Melt-marble-v*-multi.zip
            cp _dtb.7z ../
            7z x _modules_hyperos.7z -o_modules_hyperos
            7z x _modules_miui.7z -o_modules_miui
            mkdir kernel_ko
            find ../../android_build_kernel/out/android12-5.10/common -name "*.ko" -exec cp {} kernel_ko/ \;
            for file in kernel_ko/*.ko; do
              llvm-objcopy --strip-debug "$file"
            done

            while read line
            do
              cp kernel_ko/$line _modules_hyperos/_vendor_boot_modules/
            done < ../../melt_hyperos_diff_boot.txt

            while read line
            do
              cp kernel_ko/$line _modules_hyperos/_vendor_dlkm_modules/
            done < ../../melt_hyperos_diff_dlkm.txt

            ### TODO
            #while read line
            #do
            #  cp kernel_ko/$line _modules_miui/_vendor_boot_modules/
            #done < ../../melt_miui_diff_boot.txt
            #
            #while read line
            #do
            #  cp kernel_ko/$line _modules_miui/_vendor_dlkm_modules/
            ###done < ../../melt_hyperos_diff_dlkm.txt 

            rm _modules_hyperos.7z
            rm _modules_miui.7z
            cd _modules_hyperos
            7z a _modules_hyperos.7z ./*
            mv _modules_hyperos.7z ../../_modules_hyperos.7z
            cd ../_modules_miui
            7z a _modules_miui.7z ./*
            mv _modules_miui.7z ../../_modules_miui.7z
            cd ../../

            zip -r9 "Anykernel3-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}.zip" * -x .git README.md 'tmp_down/*' '*.py'
          else
            git clone --depth=1 https://github.com/FlyLoongZ/AnyKernel3
            cp android_build_kernel/out/android12-5.10/common/arch/arm64/boot/Image AnyKernel3/Image
            cd AnyKernel3
            zip -r9 "Anykernel3-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}.zip" * -x .git README.md
          fi

      - name: Upload melt build modules
        if: contains(inputs.kernel_source, 'fork_melt')
        uses: actions/upload-artifact@v4 
        with:
          name: "melt-build-modules-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}"
          path: Anykernel3/tmp_down/kernel_ko/

      - name: Create release text
        env: 
          ksu_patch: ${{ inputs.ksu_patch }}
          ap_patch: ${{ inputs.ap_patch }}
          susfs4ksu_patch: ${{ inputs.susfs4ksu_patch }}
        run: |
          if [[ ${{ env.ksu_patch }} != none ]]; then
            echo "KernelSU: ✔️ (${{ env.ksu_patch }})" >> release.txt
            echo "KernelSU Version: $(cd android_build_kernel/common/KernelSU && expr 10200 + $(git rev-list --count HEAD))" >> release.txt
            if [[ ${{ env.susfs4ksu_patch }} == true ]]; then
              echo "susfs4ksu: ✔️" >> release.txt
              echo "susfs4ksu Version: $(cat android_build_kernel/common/include/linux/susfs.h | grep -E '^#define SUSFS_VERSION' | cut -d' ' -f3 | sed 's/"//g')" >> release.txt
            fi
          fi

          if [[ ${{ env.ap_patch }} == true ]]; then
            echo "Apatch: ✔️" >> release.txt
          fi

          echo "Kernel Version: ${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}" >> release.txt
          echo "Kernel Source: $(cd android_build_kernel/common && git remote -v | awk '/https/ {print $2; exit}')" >> release.txt
          echo "Kernel Source Branch: $(cd android_build_kernel/common && git branch --show-current)" >> release.txt
          echo "Kernel Source Commit: $(cd android_build_kernel/common && git rev-parse --short HEAD)" >> release.txt
      
      - name: Create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.set-env-date.outputs.BUILDDATE }}.${{ github.run_number }}
          files: "AnyKernel3/Anykernel3-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}.zip"
          body_path: release.txt
