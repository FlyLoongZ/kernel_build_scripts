name: Build Android GKI Kernel

on:
  workflow_dispatch:
    inputs: 
      ksu_patch:
        description: 'Add KernelSU latest patch'
        required: false
        type: boolean

      ap_patch:
        description: 'Add Apatch latest patch'
        required: false
        type: boolean

      ccache_set:
        description: 'Enable CCache'
        required: false
        type: boolean

      BUILD_NUMBER:
        description: 'ci.android.com build number'
        required: true
        type: string
        
defaults:
  run:
    shell: bash

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Setup CCache
        if: ${{ inputs.ccache_set }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G          
        
      - name: Set Build Date
        id: set-env-date
        run: echo "BUILDDATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      
      - name: Clone Build Source
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs zip
          
          mkdir -p ~/.bin
          PATH="${HOME}/.bin:${PATH}"
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

          mkdir android_build
          cd android_build
          ~/.bin/repo init -u https://github.com/FlyLoongZ/kernel_build_scripts -b repo_manifest --git-lfs
          ~/.bin/repo sync

      - name: Add KernelSU
        if: ${{ inputs.ksu_patch }}
        run: | 
          cd android_build/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          cd KernelSU
          echo "KernelSU_version=$(expr 10200 + $(git rev-list --count HEAD))"  >> "$GITHUB_ENV"

      - name: Set CCache env
        if: ${{ inputs.ccache_set }}
        run: |
          cd android_build
          mkdir .bin
          cd .bin
          ln -s /usr/bin/ccache clang
          
      - name: Build Kernel
        env: 
          ccache_set: ${{ inputs.ccache_set }}
        run: |
          cd android_build
          if [[ ${{ env.ccache_set }} == true ]]; then
            export 'CCACHE_LOCAL_PATH=.bin'
          else
            echo 'No add CCache'
          fi

          cd common
          git config --global user.email build-user@build-host
          git config --global user.name build-user
          git tag -a v5.10.226 -m "android12-5.10" fbe645b
          sed -i '1d' arch/arm64/configs/gki_defconfig
          sed -i '116,121d' scripts/setlocalversion
          cd ..

          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 BUILD_NUMBER=${{ inputs.BUILD_NUMBER }} build/build.sh -j4

      - name: Add Apatch
        if: ${{ inputs.ap_patch }}
        env:
          ap_key: ${{ secrets.Apatch_Key }}
        run: |
          cd android_build/out/android12-5.10/dist
          mkdir apatch
          cd apatch
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android
          mv ../Image ../Image-old
          chmod +x kptools-linux
          ./kptools-linux -p --image ../Image-old --skey "$ap_key" --kpimg kpimg-android --out ../Image
          
      - name: Read Kernel Version
        id: set-env-kernel-version
        run: echo "KERNEL_VERSION=$(basename $(find ./android_build/out/android12-5.10/staging/lib/modules/ -name "*android12*"))" >> $GITHUB_OUTPUT

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: "Image-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}-ab${{ inputs.BUILD_NUMBER }}"
          path: android_build/out/android12-5.10/dist/Image
      
      - name: Package Kerenl
        run: |
          git clone --depth=1 https://github.com/FlyLoongZ/AnyKernel3
          cp android_build/out/android12-5.10/dist/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 "Anykernel3-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}-ab${{ inputs.BUILD_NUMBER }}.zip" * -x .git README.md
      
      - name: Create Release Text
        env: 
          ksu_patch: ${{ inputs.ksu_patch }}
          ap_patch: ${{ inputs.ap_patch }}
        run: |
          if [[ ${{ env.ksu_patch }} == true ]]; then
            echo "KernelSU: ✔️" >> release.txt
            echo "KernelSU Version: $KernelSU_version" >> release.txt
          else
            echo "KernelSU: ❌" >> release.txt
          fi

          if [[ ${{ env.ap_patch }} == true ]]; then
            echo "Apatch: ✔️" >> release.txt
          else
            echo "Apatch: ❌" >> release.txt
          fi

          echo "Kernel Version: ${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}-ab${{ inputs.BUILD_NUMBER }}" >> release.txt
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.set-env-date.outputs.BUILDDATE }}.${{ github.run_number }}
          files: "AnyKernel3/Anykernel3-${{ steps.set-env-kernel-version.outputs.KERNEL_VERSION }}-ab${{ inputs.BUILD_NUMBER }}.zip"
          body_path: release.txt
